apiVersion: v1
kind: Namespace
metadata:
  name: hpa-eval-calibrate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cold-start-calibrate
  namespace: hpa-eval-calibrate
  labels:
    app: cold-start-calibrate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cold-start-calibrate
  template:
    metadata:
      labels:
        app: cold-start-calibrate
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: delay
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sleep", "8"]
      containers:
        - name: hpa-eval-app
          image: cal-registry:5000/hpa-eval-app:calibrate
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "200m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: cold-start-calibrate
  namespace: hpa-eval-calibrate
spec:
  selector:
    app: cold-start-calibrate
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cold-start-calibrate
  namespace: hpa-eval-calibrate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cold-start-calibrate
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
      selectPolicy: Max
