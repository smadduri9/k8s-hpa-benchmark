apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hpa-eval

resources:
  - ../namespace.yaml
  - ../deployment-fixed.yaml
  - ../deployment-hpa.yaml
  - ../hpa.yaml
  - ../service.yaml
  - ../prometheus/configmap.yaml
  - ../prometheus/deployment.yaml
  - ../prometheus/service.yaml

images:
  - name: gcr.io/PROJECT_ID/hpa-eval-app
    newName: hpa-eval-app
    newTag: smoke

patches:
  - path: patch-fixed-replicas.yaml
  - path: patch-hpa-max.yaml
  - path: patch-image-pull.yaml
  - path: patch-services-nodeport.yaml
