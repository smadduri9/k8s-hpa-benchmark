apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hpa-eval

resources:
  - ../namespace.yaml
  - ../deployment-fixed.yaml
  - ../deployment-hpa.yaml
  - ../hpa.yaml
  - ../service.yaml
  - ../prometheus/configmap.yaml
  - ../prometheus/deployment.yaml
  - ../prometheus/service.yaml

images:
  - name: PLACEHOLDER_REGISTRY/hpa-eval-app
    newName: hpa-eval-app
    newTag: smoke

patches:
  - path: patch-fixed-replicas.yaml
  - path: patch-hpa-max.yaml
  - path: patch-image-pull.yaml
  - target:
      kind: Service
      name: hpa-eval-fixed-svc
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target:
      kind: Service
      name: hpa-eval-hpa-svc
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30081
