apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-eval-fixed
  namespace: hpa-eval
spec:
  template:
    spec:
      containers:
        - name: hpa-eval-app
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-eval-hpa
  namespace: hpa-eval
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: hpa-eval-app
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-eval-hpa
  namespace: hpa-eval
spec:
  minReplicas: 2
