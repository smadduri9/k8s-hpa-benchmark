<text x="480.0" y="324" font-size="20" font-weight="600" fill="#172b4d" text-anchor="middle">FastAPI CPU-bound workload</text>
<text x="480.0" y="348" font-size="16" font-weight="400" fill="#172b4d" text-anchor="middle">Fixed capacity or autoscaled replicas</text>
