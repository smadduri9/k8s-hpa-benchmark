<rect x="315" y="665" width="330" height="65" rx="8" fill="#e9f4ef" stroke="#49866d" stroke-width="1.5"/>
<text x="480.0" y="694" font-size="20" font-weight="600" fill="#172b4d" text-anchor="middle">artifacts/v1.1</text>
<text x="480.0" y="718" font-size="16" font-weight="400" fill="#172b4d" text-anchor="middle">Evidence, summaries and verifier</text>
</g></svg>
