<text x="147.5" y="324" font-size="20" font-weight="600" fill="#172b4d" text-anchor="middle">Kubernetes HPA</text>
<text x="147.5" y="348" font-size="16" font-weight="400" fill="#172b4d" text-anchor="middle">CPU from metrics-server</text>
