<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="100%" role="img" aria-labelledby="title desc">
<title id="title">Benchmark architecture</title>
<desc id="desc">Locust sends HTTP traffic through a GKE LoadBalancer Service to a FastAPI CPU-bound workload. Kubernetes HPA controls workload replicas using metrics-server CPU. Prometheus collects application metrics, and a separate sampler records desired and ready replicas. Locust stats and replica observations feed publication validation and the artifacts/v1.1 evidence package. Prometheus coverage evidence is not bundled.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/></marker>
  <marker id="stop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a12634"/></marker>
</defs>
<rect width="960" height="760" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172b4d">

